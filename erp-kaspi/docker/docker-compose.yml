# MASTER PROMPT §12 / §132 — local production-like deployment.
#
# Usage:
#   cd docker && docker compose up --build
#   docker compose exec -e DATABASE_USER=erp_migrator api alembic upgrade head
#
# TD-008 role model (scripts/split_db_roles.sh is the single source of truth):
#   erp_migrator — schema owner, the only role that runs migrations;
#   erp_app      — DML only (REVOKE CREATE; see docker/initdb/03-create-app-role.sh).
# The postgres image bootstrap superuser IS erp_migrator: migrations and
# schema provisioning run under it, the API process connects as erp_app.
#
# PostgreSQL data lives in the named volume `pgdata`; secrets come from the
# environment / .env file (§10) — never baked into the image.
#
# NOTE (§132): a container-based build is only testable where a Docker daemon
# is available; the compose file is kept minimal on purpose (PostgreSQL 15 +
# the API + a healthcheck-gated dependency).

name: erp

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_migrator
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env (§10)}
      POSTGRES_DB: erp_dev
      # §15 — the database itself works in UTC.
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The schema is applied automatically on the FIRST start only.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # erp_app (DML-only) is created after the schema exists (§15/TD-008).
      - ./initdb/03-create-app-role.sh:/docker-entrypoint-initdb.d/03-create-app-role.sh:ro
    # ADR-005 / baseline-audit item 1: PostgreSQL is reachable only from the
    # compose-internal network (the api service). No host/Internet port.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_migrator -d erp_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: erp_dev
      DATABASE_USER: erp_app
      DATABASE_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env (§10)}
      # Used only by the CMD below to run migrations as erp_migrator; the
      # uvicorn process itself never holds DDL rights (TD-008).
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env (§10)}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env (§10, §55)}
      PYTHONPATH: /app
    ports:
      - "8000:8000"

volumes:
  pgdata:
