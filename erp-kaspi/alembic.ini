; Alembic configuration (MASTER PROMPT §7).
;
; The connection URL is NOT stored here — it is assembled from environment
; variables by alembic/env.py through app.core.config.DatabaseSettings (§10).

[alembic]
script_location = alembic
prepend_sys_path = .

; path_separator replaces the deprecated version_path_separator in Alembic
; 1.16+. Without it Alembic falls back to splitting paths on spaces, commas
; and colons, which breaks on any path containing a space.
path_separator = os
timezone = UTC

; Migration file names are prefixed with a UTC timestamp so that the
; chronological order is visible in the directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
; No automatic formatting hooks: migrations are reviewed manually (§89).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
