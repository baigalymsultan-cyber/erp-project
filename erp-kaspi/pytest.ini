[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:anyio
    ignore::DeprecationWarning:anyio._lazyimport
    ignore::DeprecationWarning:starlette._compat
    # anyio>=4.11 emits its BlockingPortal alias deprecation with
    # stacklevel=3, so pytest attributes it to starlette.testclient.
    ignore::DeprecationWarning:starlette.testclient
